name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.0"
      - name: Build
        run: ./scripts/buildprod.sh
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/232682284074/locations/global/workloadIdentityPools/github/providers/my-repo' 
          service_account: 'cloud-run-deployer@notely-512904.iam.gserviceaccount.com'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: 'Use gcloud CLI'
        run: 'gcloud info'
      - name: 'Build Docker image'
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-512904/notely-ar-repo/notely:latest .
      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-cetral1-docker.pkg.dev/notely-512904/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project notely-512904 --max-instances=4
